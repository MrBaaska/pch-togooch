<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тогоочийн хяналтын самбар</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen text-slate-100">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 pb-6 border-b border-slate-800">
            <div>
                <h1 class="text-3xl font-bold">👨‍🍳 Тогоочийн хяналтын самбар</h1>
                <p class="text-slate-400 text-sm mt-1">Захиалга болон цэсийн удирдлагын хэсэг</p>
            </div>
            <!-- Салбараар шүүх select -->
            <div class="mt-4 md:mt-0 flex items-center gap-3">
                <label class="text-sm text-slate-300">Салбараар шүүх:</label>
                <select id="filterDept" onchange="loadOrders()" class="bg-slate-800 border border-slate-700 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="" selected>Бүх салбар</option>
                    <option value="Удирдлага">Удирдлага</option>
                    <option value="Техник тасаг">Техник тасаг</option>
                    <option value="Санхүү тасаг">Санхүү тасаг</option>
                    <option value="Хүний нөөц">Хүний нөөц</option>
                    <option value="Зам оношилгоо">Зам оношилгоо</option>
                    <option value="АХО">АХО</option>
                    <option value="Замын 16-р хэсэг">Замын 16-р хэсэг</option>
                    <option value="Бусад">Бусад</option>
                </select>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Зүүн тал: Шинэ хоолны цэс бүртгэх -->
            <div class="glass text-slate-800 p-6 rounded-2xl shadow-2xl h-fit">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2"><span>➕</span> Шинэ хоол нэмэх</h2>
                <form id="menuForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Огноо</label>
                        <input type="date" id="menuDate" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white/80">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Хоолны нэр</label>
                        <input type="text" id="menuTitle" required placeholder="Жишээ: Цуйван" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white/80">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Орц / Тайлбар</label>
                        <textarea id="menuDesc" rows="2" placeholder="Үхрийн мах, гурил..." class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white/80"></textarea>
                    </div>
                    <div>
                        <label for="menuImageFile" class="block text-sm font-medium text-slate-700 mb-1">Зураг upload хийх</label>
                        <input type="file" id="menuImageFile" accept="image/*" class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-white/80 text-sm">
                        <p class="text-xs text-slate-500 mt-1">Зөвхөн зураг, дээд хэмжээ 5 MB.</p>
                        <img id="menuImagePreview" alt="Сонгосон зургийн урьдчилсан харагдац" class="hidden mt-3 max-h-40 w-full rounded-xl object-cover">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-lg">
                        Цэсэнд нэмэх
                    </button>
                </form>
            </div>

            <!-- Баруун тал: Захиалгын жагсаалт болон тоон үзүүлэлт -->
            <div class="lg:col-span-2 space-y-8">
                <!-- Захиалгын хүснэгт -->
                <div class="glass text-slate-800 p-6 rounded-2xl shadow-2xl">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold flex items-center gap-2"><span>📋</span> Өнөөдрийн Захиалгууд</h2>
                        <span id="totalCount" class="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full">Нийт: 0 порц</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead>
                                <tr class="border-b border-slate-200 text-slate-500">
                                    <th class="pb-3">Салбар</th>
                                    <th class="pb-3">Ажилтан</th>
                                    <th class="pb-3">Хоол</th>
                                    <th class="pb-3 text-center">Тоо</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTableBody">
                                <tr><td colspan="4" class="py-4 text-center text-slate-500">Захиалга одоогоор алга байна.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Ажилтнуудын сэтгэгдэл -->
                <div class="glass text-slate-800 p-6 rounded-2xl shadow-2xl">
                    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2"><span>💬</span> Ирсэн санал хүсэлтүүд</h2>
                    <div id="feedbackContainer" class="space-y-3 max-h-60 overflow-y-auto">
                        <p class="text-sm text-slate-500">Санал хүсэлт байхгүй байна.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://fvgdqcjzgeqctowcdgtp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_PhWvqNl8S-s8n7kTUFEFoA_DNh7xPl8';
        const MENU_IMAGE_BUCKET = 'menu-images';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Өнөөдрийн огноог автоматаар оруулах
        document.getElementById('menuDate').value = new Date().toISOString().split('T')[0];

        const menuImageFileInput = document.getElementById('menuImageFile');
        const menuImagePreview = document.getElementById('menuImagePreview');
        let previewObjectUrl;

        menuImageFileInput.addEventListener('change', () => {
            if (previewObjectUrl) {
                URL.revokeObjectURL(previewObjectUrl);
                previewObjectUrl = undefined;
            }

            const file = menuImageFileInput.files[0];
            if (!file) {
                menuImagePreview.classList.add('hidden');
                menuImagePreview.removeAttribute('src');
                return;
            }

            if (!file.type.startsWith('image/')) {
                alert('Зөвхөн зургийн файл сонгоно уу.');
                menuImageFileInput.value = '';
                menuImagePreview.classList.add('hidden');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                alert('Зургийн хэмжээ 5 MB-аас ихгүй байна.');
                menuImageFileInput.value = '';
                menuImagePreview.classList.add('hidden');
                return;
            }

            previewObjectUrl = URL.createObjectURL(file);
            menuImagePreview.src = previewObjectUrl;
            menuImagePreview.classList.remove('hidden');
        });

        // Хоолны цэс бүртгэх
        document.getElementById('menuForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const date = document.getElementById('menuDate').value;
            const title = document.getElementById('menuTitle').value;
            const description = document.getElementById('menuDesc').value;
            let image_url = '';
            const imageFile = menuImageFileInput.files[0];

            if (imageFile) {
                const fileExtension = imageFile.name.includes('.') ? imageFile.name.split('.').pop().toLowerCase() : 'img';
                const filePath = `${Date.now()}-${crypto.randomUUID()}.${fileExtension}`;
                const { error: uploadError } = await _supabase.storage
                    .from(MENU_IMAGE_BUCKET)
                    .upload(filePath, imageFile, { contentType: imageFile.type, upsert: false });

                if (uploadError) {
                    console.error('Зураг upload хийхэд алдаа гарлаа:', uploadError);
                    if (/bucket not found/i.test(uploadError.message)) {
                        alert('Supabase дээр menu-images зураг хадгалах bucket олдсонгүй. Төслийн Dashboard → SQL Editor хэсэгт supabase-menu-images.sql файлын SQL-ийг ажиллуулаад дахин оролдоно уу.');
                    } else {
                        alert('Зураг upload хийхэд алдаа гарлаа: ' + uploadError.message);
                    }
                    return;
                }

                const { data } = _supabase.storage.from(MENU_IMAGE_BUCKET).getPublicUrl(filePath);
                image_url = data.publicUrl;
            }

            const { error } = await _supabase.from('menu_items').insert([{ date, title, description, image_url }]);
            if (error) {
                alert('Алдаа: ' + error.message);
            } else {
                alert('Хоол амжилттай бүртгэгдлээ!');
                document.getElementById('menuForm').reset();
                document.getElementById('menuDate').value = new Date().toISOString().split('T')[0];
                if (previewObjectUrl) {
                    URL.revokeObjectURL(previewObjectUrl);
                    previewObjectUrl = undefined;
                }
                menuImagePreview.classList.add('hidden');
                menuImagePreview.removeAttribute('src');
            }
        });

        // Захиалга татаж харуулах (Салбараар шүүх боломжтой)
        async function loadOrders() {
            const selectedDept = document.getElementById('filterDept').value;
            
            let query = _supabase.from('orders').select(`
                id,
                department,
                employee_name,
                quantity,
                menu_items ( title )
            `);

            if (selectedDept) {
                query = query.eq('department', selectedDept);
            }

            const { data, error } = await query;
            const tbody = document.getElementById('ordersTableBody');
            const totalCountEl = document.getElementById('totalCount');

            if (error) {
                console.error('Захиалга татахад алдаа гарлаа:', error);
                tbody.innerHTML = '<tr><td colspan="4" class="py-4 text-center text-red-600"></td></tr>';
                tbody.rows[0].cells[0].textContent = 'Захиалга ачаалж чадсангүй: ' + error.message;
                totalCountEl.textContent = 'Нийт: —';
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-500">Захиалга олдсонгүй.</td></tr>`;
                totalCountEl.textContent = `Нийт: 0 порц`;
                return;
            }

            let totalPortions = 0;
            tbody.innerHTML = data.map(order => {
                totalPortions += order.quantity;
                return `
                    <tr class="border-b border-slate-100">
                        <td class="py-3 font-medium text-indigo-900">${order.department}</td>
                        <td class="py-3">${order.employee_name}</td>
                        <td class="py-3">${order.menu_items ? order.menu_items.title : 'Устсан хоол'}</td>
                        <td class="py-3 text-center font-bold text-indigo-600">${order.quantity}</td>
                    </tr>
                `;
            }).join('');

            totalCountEl.textContent = `Нийт: ${totalPortions} порц`;
        }

        // Сэтгэгдэл татах
        async function loadFeedbacks() {
            const { data, error } = await _supabase.from('feedbacks').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('feedbackContainer');

            if (error) {
                console.error('Санал хүсэлт татахад алдаа гарлаа:', error);
                container.innerHTML = '<p class="text-sm text-red-600"></p>';
                container.firstElementChild.textContent = 'Санал хүсэлт ачаалж чадсангүй: ' + error.message;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-500">Санал хүсэлт байхгүй байна.</p>`;
                return;
            }

            container.innerHTML = data.map(fb => `
                <div class="bg-white/60 p-3 rounded-xl border border-slate-200">
                    <div class="flex justify-between items-center text-xs text-slate-500 mb-1">
                        <span class="font-semibold text-indigo-900">${fb.employee_name} (${fb.department})</span>
                        <span>${new Date(fb.created_at).toLocaleDateString()}</span>
                    </div>
                    <p class="text-sm text-slate-700">${fb.comment}</p>
                </div>
            `).join('');
        }

        loadOrders();
        loadFeedbacks();
    </script>
</body>
</html>
